        <p>
          <strong>TEN SECONDS</strong> è un'applicazione ludica e quiz musicale arcade. Lo scopo dell'applicazione è mettere alla prova l'orecchio musicale e i riflessi degli utenti: in ciascuna manche hai esattamente 10 secondi di tempo per ascoltare un estratto sonoro e indovinare il titolo della canzone o l'artista corretto.
        </p>
