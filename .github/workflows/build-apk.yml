name: Build Android APK (Pre-Beta Cloud Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: 'https://rddntjxqbqwrcdvhuaxi.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_3Z6TY-lCTZAbhi6GsX4QyA_AmW0ctpq'

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenSeconds-PreBeta-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
